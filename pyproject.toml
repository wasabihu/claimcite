[project]
name = "claimcite"
dynamic = ["version"]
description = "Check that every citation in a document is real, matches what the text says it is, and supports the quoted words."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["citation", "fact-checking", "pubmed", "crossref", "doi", "evidence-based", "hallucination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Text Processing",
]

[project.scripts]
claimcite = "claimcite.cli:main"

[project.urls]
Homepage = "https://github.com/wasabihu/claimcite"
Issues = "https://github.com/wasabihu/claimcite/issues"
Changelog = "https://github.com/wasabihu/claimcite/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claimcite/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
