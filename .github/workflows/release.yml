# Push a tag such as v0.1.0 to publish. The version in src/claimcite/__init__.py must match the tag.
# PyPI side (once): add a trusted publisher for this repo, workflow release.yml, environment "pypi".
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q
      - name: Tag matches the package version
        run: |
          test "v$(uv run python -c 'import claimcite; print(claimcite.__version__)')" = "$GITHUB_REF_NAME"
          test "v$(uv run python -c 'import json; print(json.load(open(\"server.json\"))[\"version\"])')" = "$GITHUB_REF_NAME"
          test "v$(uv run python -c 'import json; print(json.load(open(\"server.json\"))[\"packages\"][0][\"version\"])')" = "$GITHUB_REF_NAME"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PyPI release visibility
        env:
          PKG_VERSION: ${{ github.ref_name }}
        run: |
          ver="${PKG_VERSION#v}"
          for i in $(seq 1 12); do
            if curl -fsSL "https://pypi.org/pypi/claimcite/${ver}/json" >/dev/null 2>&1; then
              echo "PyPI claimcite ${ver} is live"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for PyPI claimcite ${ver}" >&2
          exit 1
      - name: Install verified mcp-publisher v1.8.16
        run: |
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz"
          echo "6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate and publish to Official MCP Registry
        run: |
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## /{if (p) exit; if (index($0, "## " v)) {p=1; next}} p' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "claimcite $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
